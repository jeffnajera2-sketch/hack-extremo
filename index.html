<!DOCTYPE html>
<html>
<head>
    <title>System Breach</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
            overflow: hidden;
        }

        #terminal {
            white-space: pre-line;
            font-size: 18px;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        #time {
            position: fixed;
            top: 10px;
            right: 20px;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body onclick="startHack()">

<div id="time"></div>
<div id="terminal"></div>

<audio id="alarm">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>

<script>
    const terminal = document.getElementById("terminal");
    const alarm = document.getElementById("alarm");

    const messages = [
        "⚠ SISTEMA COMPROMETIDO...",
        "Detectando dirección IP...",
        "Accediendo a archivos personales...",
        "Copiando fotos privadas...",
        "Instalando acceso remoto...",
        "ERROR CRÍTICO DETECTADO...",
        "Enviando datos al servidor...",
        "Borrando evidencia..."
    ];

    let i = 0;
    let j = 0;

    function typeEffect() {
        if (i < messages.length) {
            if (j < messages[i].length) {
                terminal.innerHTML += messages[i].charAt(j);
                j++;
                setTimeout(typeEffect, 40);
            } else {
                terminal.innerHTML += "\n";
                j = 0;
                i++;
                setTimeout(typeEffect, 500);
            }
        } else {
            setTimeout(() => {
                terminal.innerHTML += "\n\n😂 TRANQUIL@, ES UNA BROMA DE JEFF!";
                alarm.pause();
            }, 2000);
        }
    }

    function startHack() {
        alarm.play();
        typeEffect();
        document.body.onclick = null;
    }

    function updateTime() {
        const now = new Date();
        document.getElementById("time").innerText =
            "Hora actual: " + now.toLocaleTimeString();
    }

    setInterval(updateTime, 1000);
</script>

</body>
</html>
