<!DOCTYPE html>
<html>
<head>
    <title>System Error</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: monospace;
            text-align: center;
            padding-top: 100px;
            overflow: hidden;
        }

        h1 {
            font-size: 50px;
            animation: glitch 0.5s infinite;
        }

        p {
            font-size: 20px;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px red; }
            50% { text-shadow: -2px -2px blue; }
            100% { text-shadow: 2px 2px red; }
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>⚠ HAS SIDO HACKEADO ⚠</h1>
    <p>Tu dirección IP ha sido registrada...</p>
    <p>Accediendo a tus archivos personales...</p>
    <p class="blink">Descargando fotos privadas...</p>

</body>
</html>
